services:
  opportunity-engine:
    build: .
    container_name: opportunity-engine
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/opportunity_engine.db
    # Lets the app reach services on the host (e.g. the existing stirling-pdf container published on host port 8080)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./app/prompts:/app/app/prompts   # edit prompts without rebuilding
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 60s
      timeout: 5s
      retries: 3
